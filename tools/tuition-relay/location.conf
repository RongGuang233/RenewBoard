# Include inside the existing HTTPS server {}.
location = /tuition {
    if ($tuition_expected_auth = "") { return 405; }
    if ($http_authorization != $tuition_expected_auth) { return 401; }

    alias /www/renewboard-tuition/data/latest.json;
    default_type application/json;
    client_max_body_size 2000000;
    client_body_buffer_size 16k;
    # Lua reads before DAV: force a file even for a small request.
    client_body_in_file_only clean;
    client_body_timeout 25s;
    client_body_temp_path /www/renewboard-tuition/tmp;
    dav_methods PUT;
    create_full_put_path off;
    dav_access user:rw;
    # Keep the inherited access-phase hook (e.g. WAF) available.
    rewrite_by_lua_file /www/renewboard-tuition/validate.lua;

    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store" always;
    # Location-level add_header overrides the site's inherited headers.
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /var/log/nginx/tuition-access.log tuition;
}
